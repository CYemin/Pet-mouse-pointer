<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仓鼠 · 17种状态测试</title>
<style>
:root{--bg:#f4efe6;--panel:#fffaf2;--ink:#44362d;--line:#d8caba}
body.dark{--bg:#202a2d;--panel:#2b373b;--ink:#f5eadf;--line:#526064}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:850px;margin:auto;padding:24px 16px}h1{font-size:25px;margin:0 0 8px}
button,select,a{font:inherit;color:inherit}button,select{background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:7px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.arena{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:9px;margin:14px 0}
.targets{display:flex;gap:30px;align-items:center;height:80px}.targets *{cursor:inherit}
.target{width:18px;height:18px;padding:0;border-radius:50%;background:var(--ink)}
table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{border-bottom:1px solid var(--line);text-align:center;padding:7px 2px}
    th:first-child,td:first-child{width:120px;text-align:left}td button{min-width:60px;min-height:58px;display:inline-grid;place-items:center;padding:3px}
button[aria-pressed=true]{outline:2px solid #a87542;outline-offset:1px}
.sprite{position:relative;display:block;flex-shrink:0}img{width:100%;height:100%;image-rendering:pixelated;display:block}
.marker{display:none;position:absolute;width:9px;height:9px;transform:translate(-50%,-50%);pointer-events:none;background:linear-gradient(#008d93,#008d93) center/100% 1px no-repeat,linear-gradient(#008d93,#008d93) center/1px 100% no-repeat}
.hotspots .marker{display:block}#drag{touch-action:none}a{margin-right:12px}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #008d93}
</style>
<main>
<h1>仓鼠 · 17种状态</h1>
<p>所有动画按所选像素尺寸 1∶1 展示。点选任意格子，在圆靶区域试用。</p>
<div class="controls">
<label>尺寸 <select id="size"><option>32</option><option selected>48</option><option>64</option><option>96</option><option>128</option></select> px</label>
<button id="pause" aria-pressed="false">暂停</button><button id="slow" aria-pressed="false">半速</button>
<button id="background" aria-pressed="false">深色背景</button><button id="hotspots" aria-pressed="false">显示热点</button>
</div>
<section class="arena"><strong id="chosen"></strong><div class="targets">
<button class="target" aria-label="圆靶"></button><button class="target" aria-label="圆靶"></button><a id="link" href="#">试点链接</a><button id="drag">按住拖动</button></div><span id="hits" aria-live="polite">已点中 0 次</span></section>
<p><a id="package" download>下载整套 Windows 主题</a><a id="download" download>下载当前动画</a></p>
<table><thead><tr><th>状态</th><th>金黄</th><th>银灰</th><th>奶白</th></tr></thead><tbody></tbody></table>
</main>
<script>
const pets=__PETS__;
const size=document.querySelector('#size'),arena=document.querySelector('.arena');
const pause=document.querySelector('#pause'),slow=document.querySelector('#slow');
const cells=[];
let selected=0,role='normal',hits=0,epoch=performance.now(),dragging=false;
let cache=[];
for(const [id,action] of Object.entries(pets[0].sizes[48].roles)){
 const row=document.createElement('tr');
 const label=document.createElement('th');label.scope='row';label.textContent=action.label;row.append(label);
 pets.forEach((pet,index)=>{
  const td=document.createElement('td'),button=document.createElement('button');
  button.setAttribute('aria-label',pet.color+' · '+action.label);
  button.innerHTML='<span class="sprite"><img alt=""><span class="marker"></span></span>';
  button.onclick=()=>{selected=index;role=id;render()};
  td.append(button);row.append(td);cells.push({index,id,button,last:null});
 });
 document.querySelector('tbody').append(row);
}
function at(action,elapsed){
 let tick=elapsed*60/1000%action.ticks.reduce((a,b)=>a+b,0);
 for(let i=0;i<action.ticks.length;i++){if(tick<action.ticks[i])return action.frames[action.sequence[i]];tick-=action.ticks[i]}
 return action.frames[0];
}
function pointer(action,elapsed){return 'url("'+at(action,elapsed)+'") '+action.hotspot.join(' ')+', default'}
function render(){
 const n=Number(size.value),pet=pets[selected],variant=pet.sizes[n];
 document.querySelector('#chosen').textContent=pet.color+'仓鼠 · '+variant.roles[role].label+' · '+variant.roles[role].gesture;
 document.querySelector('#package').href=pet.package;
 document.querySelector('#download').href=variant.roles[role].cursor;
 cells.forEach(cell=>{
  cell.button.setAttribute('aria-pressed',cell.index===selected&&cell.id===role);
  const art=cell.button.querySelector('.sprite');art.style.width=art.style.height=n+'px';
  const [x,y]=pets[cell.index].sizes[n].roles[cell.id].hotspot;
  const marker=cell.button.querySelector('.marker');marker.style.left=(x+.5)+'px';marker.style.top=(y+.5)+'px';
  cell.last=null;
 });
 cache=[...new Set(pets.flatMap(p=>Object.values(p.sizes[n].roles).flatMap(a=>a.frames)))].map(src=>{const image=new Image();image.src=src;return image});
 draw(performance.now());
}
function draw(now){
 const elapsed=pause.getAttribute('aria-pressed')==='true'?0:(now-epoch)*(slow.getAttribute('aria-pressed')==='true'?.5:1);
 cells.forEach(cell=>{
  const action=pets[cell.index].sizes[size.value].roles[cell.id],src=at(action,elapsed);
  if(cell.last!==src){cell.button.querySelector('img').src=src;cell.button.style.cursor=pointer(action,elapsed);cell.last=src}
 });
 const variant=pets[selected].sizes[size.value];
 arena.style.cursor=pointer(variant.roles[dragging?'move':role],elapsed);
 document.querySelector('#link').style.cursor=pointer(variant.roles.link,elapsed);
}
for(const id of ['pause','slow','background','hotspots']){
 document.querySelector('#'+id).onclick=e=>{
  const active=e.currentTarget.getAttribute('aria-pressed')!=='true';
  e.currentTarget.setAttribute('aria-pressed',active);
  if(id==='background')document.body.classList.toggle('dark',active);
  if(id==='hotspots')document.body.classList.toggle('hotspots',active);
  if(id==='pause')e.currentTarget.textContent=active?'继续':'暂停';
 };
}
size.onchange=render;
document.querySelectorAll('.target').forEach(button=>button.onclick=()=>document.querySelector('#hits').textContent='已点中 '+(++hits)+' 次');
document.querySelector('#link').onclick=e=>{e.preventDefault();document.querySelector('#hits').textContent='已点中 '+(++hits)+' 次'};
const drag=document.querySelector('#drag');let origin;
drag.onpointerdown=e=>{if(e.button!==0)return;dragging=true;origin=[e.clientX,e.clientY];drag.setPointerCapture(e.pointerId)};
drag.onpointermove=e=>{if(dragging)drag.style.transform='translate('+Math.max(-50,Math.min(50,e.clientX-origin[0]))+'px,'+Math.max(-25,Math.min(25,e.clientY-origin[1]))+'px)'};
drag.onlostpointercapture=()=>{dragging=false;drag.style.transform=''};
render();
function animate(now){draw(now);requestAnimationFrame(animate)}
requestAnimationFrame(animate);
</script>
</html>
