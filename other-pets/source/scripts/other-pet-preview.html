<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宠物指针 · 全部配色测试</title>
<style>
  :root { color-scheme: light; --bg:#f4efe6; --panel:#fffaf2; --ink:#44362d; --muted:#6d5b4d; --line:#d9cbba; --accent:#865638; --spot:#006e79 }
  body.dark { color-scheme:dark; --bg:#202a2d; --panel:#2b373b; --ink:#f5eadf; --muted:#c8b9ac; --line:#4e5f63; --accent:#f1bf93; --spot:#6ae8db }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif }
  main { max-width:900px; margin:auto; padding:36px 20px }
  h1 { margin:0; font-size:clamp(26px,5vw,38px) }
  p { color:var(--muted); margin:8px 0 20px }
  button,select { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 12px }
  button[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent) }
  button:focus-visible,select:focus-visible,a:focus-visible { outline:2px solid var(--spot); outline-offset:3px }
  a { color:var(--accent) }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center }
  .group { margin:22px 0 0 }
  .group h2 { font-size:17px; margin:0 0 9px }
  .pets { display:grid; grid-template-columns:repeat(auto-fit,minmax(106px,1fr)); gap:10px }
  .pet { min-width:0; display:grid; justify-items:center; gap:6px; padding:10px 4px }
  .art { position:relative; width:min(100%,96px); aspect-ratio:1; display:grid }
  img { image-rendering:pixelated; width:100%; height:100% }
  .hotspot { position:absolute; display:none; width:19px; height:19px; transform:translate(-50%,-50%); pointer-events:none;
    background:linear-gradient(var(--spot),var(--spot)) center/100% 1px no-repeat,linear-gradient(var(--spot),var(--spot)) center/1px 100% no-repeat }
  .show-hotspot .hotspot { display:block }
  .arena { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px }
  .controls + .arena { margin-top:14px }
  .board { position:relative; min-height:155px; display:flex; flex-wrap:wrap; gap:clamp(20px,8vw,70px); align-items:center; justify-content:center }
  .board,.board button,.board a { cursor:var(--pet-cursor,default) }
  .board a { cursor:var(--link-cursor,pointer) }
  .board.dragging #drag { cursor:var(--drag-cursor,grabbing) }
  .target { background:none; padding:0; border:1px solid var(--accent); border-radius:50%; width:28px; height:28px; display:grid; place-items:center }
  .target::before { content:""; width:7px; height:7px; background:var(--accent); border-radius:50% }
  .target.small { width:13px; height:13px }
  #drag { position:relative; touch-action:none; user-select:none }
  #response { margin:0; min-height:24px }
  #sprite { position:fixed; pointer-events:none; z-index:10 }
  .board.animated,.board.animated button,.board.animated a { cursor:none }
  .downloads { margin-top:12px }
  @media(max-width:420px) { .pets { gap:5px } }
</style>
<main>
  <h1>宠物指针 · 全部配色测试</h1>
  <p id="catalog-summary"></p>
  <div class="controls">
    <label>试用尺寸 <select id="size"><option>32</option><option selected>48</option><option>64</option><option>96</option><option>128</option></select> px</label>
    <label>动作 <select id="role"></select></label>
    <button id="pause" aria-pressed="false">暂停动画</button>
    <button id="slow" aria-pressed="false">半速</button>
    <button id="background" aria-pressed="false">深色背景</button>
    <button id="hotspots" aria-pressed="false">显示热点</button>
  </div>
  <section class="arena" aria-label="点击测试区">
    <strong id="contact"></strong>
    <div class="board">
      <button class="target" aria-label="点大圆靶"></button>
      <button class="target small" aria-label="点小圆靶"></button>
      <a id="link" href="#response">试点链接</a>
      <button id="drag">拖动我</button>
    </div>
    <p id="response" aria-live="polite">已点中 0 次</p>
  </section>
  <div class="downloads"><a id="package" download>下载整套 Windows 主题（.zip）</a> · <a id="download" download>当前动画（.ani）</a> · <a id="static-download" download>静态指针（.cur）</a></div>
  <div id="catalog" aria-label="选择宠物配色"></div>
</main>
<img id="sprite" alt="" hidden>
<script>
const pets = __PETS__;
const size = document.querySelector('#size');
const role = document.querySelector('#role');
const pause = document.querySelector('#pause');
const slow = document.querySelector('#slow');
const board = document.querySelector('.board');
const drag = document.querySelector('#drag');
const sprite = document.querySelector('#sprite');
const response = document.querySelector('#response');
const cards = [];
let preload = [];
let selected = 0;
let hits = 0;
let gesture;
let animation;
let epoch = performance.now();
const shown = new Map();
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

for (const [id, action] of Object.entries(pets[0].sizes[48].roles)) {
  const option = document.createElement('option');
  option.value = id;
  option.textContent = action.label;
  role.append(option);
}
role.value = 'normal';
document.querySelector('#catalog-summary').textContent = `${pets.length} 款配色，每款 17 种状态。选择下方配色，再用圆靶检查落点。`;

function clearAnimation() {
  animation?.cancel();
  sprite.hidden = true;
  board.classList.remove('animated');
}
function render() {
  clearAnimation();
  epoch = performance.now();
  shown.clear();
  const pixels = Number(size.value);
  const variant = pets[selected].sizes[pixels];
  const action = variant.roles[role.value];
  const contact = action.hotspot.join(',') === variant.hotspot.join(',') ? pets[selected].contact : '操作标记';
  document.querySelector('#contact').textContent = `${pets[selected].species} · ${pets[selected].color} · ${action.label} · ${contact}`;
  document.querySelector('#download').href = action.cursor;
  document.querySelector('#package').href = pets[selected].package;
  document.querySelector('#static-download').href = variant.cursor;
  cards.forEach((card, i) => {
    const {hotspot} = pets[i].sizes[pixels].roles[role.value];
    card.setAttribute('aria-pressed', i === selected);
    const point = card.querySelector('.hotspot');
    point.style.left = (hotspot[0] + 0.5) / pixels * 100 + '%';
    point.style.top = (hotspot[1] + 0.5) / pixels * 100 + '%';
  });
  const visibleActions = pets.map(pet => pet.sizes[pixels].roles[role.value]);
  const frames = new Set([...visibleActions, variant.roles.link, variant.roles.move].flatMap(action => action.frames));
  preload = Array.from(frames, src => {
    const image = new Image();
    image.src = src;
    return image;
  });
  updateMotion(epoch);
}
function frameAt(action, elapsed) {
  let tick = elapsed * 60 / 1000 % action.ticks.reduce((sum, value) => sum + value, 0);
  for (const [i, duration] of action.ticks.entries()) {
    if (tick < duration) return action.frames[action.sequence[i]];
    tick -= duration;
  }
  return action.frames[0];
}
function updateMotion(now) {
  const speed = slow.getAttribute('aria-pressed') === 'true' ? .5 : 1;
  const elapsed = reducedMotion.matches || pause.getAttribute('aria-pressed') === 'true' ? 0 : (now - epoch) * speed;
  const variant = pets[selected].sizes[size.value];
  for (const [property, name, fallback] of [
    ['--pet-cursor', role.value, 'default'], ['--link-cursor', 'link', 'pointer'], ['--drag-cursor', 'move', 'grabbing']
  ]) {
    const action = variant.roles[name];
    const [x, y] = action.hotspot;
    const value = `url("${frameAt(action, elapsed)}") ${x} ${y}, ${fallback}`;
    if (shown.get(property) === value) continue;
    shown.set(property, value);
    board.style.setProperty(property, value);
  }
  cards.forEach((card, i) => {
    const src = frameAt(pets[i].sizes[size.value].roles[role.value], elapsed);
    if (shown.get(card) === src) return;
    shown.set(card, src);
    card.querySelector('img').src = src;
  });
}
const groups = new Map();
pets.forEach((pet, i) => {
  if (!groups.has(pet.speciesId)) {
    const section = document.createElement('section');
    section.className = 'group';
    const heading = document.createElement('h2');
    heading.textContent = pet.species;
    const choices = document.createElement('div');
    choices.className = 'pets';
    section.append(heading, choices);
    document.querySelector('#catalog').append(section);
    groups.set(pet.speciesId, choices);
  }
  const card = document.createElement('button');
  card.className = 'pet';
  card.setAttribute('aria-label', `${pet.species} · ${pet.color}`);
  card.innerHTML = `<span class="art"><img alt=""><span class="hotspot"></span></span><strong></strong>`;
  card.querySelector('strong').textContent = pet.color;
  card.onclick = () => { selected = i; render(); };
  cards.push(card);
  groups.get(pet.speciesId).append(card);
});
function pointSprite(event) {
  const [x, y] = pets[selected].sizes[size.value].hotspot;
  sprite.style.left = event.clientX - x + 'px';
  sprite.style.top = event.clientY - y + 'px';
}
function react(event) {
  if (reducedMotion.matches || pause.getAttribute('aria-pressed') === 'true' ||
      !event.detail || !board.matches(':hover')) return;
  clearAnimation();
  const variant = pets[selected].sizes[size.value];
  const name = event.currentTarget?.id === 'link' ? 'link' : role.value;
  const action = variant.roles[name];
  if (action.showcaseTick !== null) {
    const speed = slow.getAttribute('aria-pressed') === 'true' ? .5 : 1;
    epoch = performance.now() - action.showcaseTick * 1000 / (60 * speed);
    updateMotion(performance.now());
    return;
  }
  const [x, y] = action.hotspot;
  if (action.hotspot.join(',') !== variant.hotspot.join(',')) return;
  sprite.src = frameAt(variant.roles[name], performance.now() - epoch);
  sprite.style.width = sprite.style.height = size.value + 'px';
  sprite.style.transformOrigin = `${x}px ${y}px`;
  pointSprite(event);
  sprite.hidden = false;
  board.classList.add('animated');
  animation = sprite.animate(
    [{transform:'none'}, {transform:pets[selected].reaction, offset:0.35}, {transform:'none'}],
    {duration:180, easing:'ease-out'}
  );
  animation.onfinish = clearAnimation;
}
function hit(event) {
  response.textContent = `已点中 ${++hits} 次`;
  react(event);
}
board.addEventListener('pointermove', event => { if (!sprite.hidden) pointSprite(event); });
board.addEventListener('pointerleave', clearAnimation);
document.querySelectorAll('.target').forEach(target => target.onclick = hit);
document.querySelector('#link').onclick = event => { event.preventDefault(); hit(event); };
drag.onpointerdown = event => {
  if (event.button !== 0) return;
  clearAnimation();
  gesture = {id:event.pointerId, x:event.clientX, y:event.clientY};
  drag.setPointerCapture(event.pointerId);
  board.classList.add('dragging');
};
drag.onpointermove = event => {
  if (gesture?.id !== event.pointerId) return;
  const bounds = board.getBoundingClientRect();
  const base = drag.offsetLeft;
  const dx = Math.max(-base, Math.min(bounds.width - base - drag.offsetWidth, event.clientX - gesture.x));
  const dy = Math.max(-drag.offsetTop, Math.min(bounds.height - drag.offsetTop - drag.offsetHeight, event.clientY - gesture.y));
  drag.style.transform = `translate(${dx}px,${dy}px)`;
};
drag.onlostpointercapture = () => {
  gesture = undefined;
  drag.style.transform = '';
  board.classList.remove('dragging');
};
drag.onpointerup = event => {
  if (gesture?.id !== event.pointerId) return;
  if (Math.hypot(event.clientX - gesture.x, event.clientY - gesture.y) >= 5) {
    response.textContent = `已完成拖动 · 已点中 ${hits} 次`;
  }
};
size.onchange = render;
role.onchange = render;
pause.onclick = () => {
  const paused = pause.getAttribute('aria-pressed') !== 'true';
  pause.setAttribute('aria-pressed', paused);
  pause.textContent = paused ? '继续动画' : '暂停动画';
  render();
};
slow.onclick = () => {
  slow.setAttribute('aria-pressed', slow.getAttribute('aria-pressed') !== 'true');
  render();
};
for (const [id, className] of [['background','dark'], ['hotspots','show-hotspot']]) {
  document.querySelector('#' + id).onclick = event => {
    event.currentTarget.setAttribute('aria-pressed', document.body.classList.toggle(className));
  };
}
function animate(now) {
  updateMotion(now);
  requestAnimationFrame(animate);
}
render();
requestAnimationFrame(animate);
</script>
</html>
